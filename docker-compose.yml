services:
  # -----------------------------------------------------------------
  # DATABASE: PostgreSQL 18 (Alpine)
  # -----------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: soc_postgres
    pull_policy: missing
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-soc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Soc0903297444}
      POSTGRES_DB: ${DB_NAME:-soc_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./database/pgdata:/var/lib/postgresql/data
    networks:
      - soc-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-soc_admin} -d ${DB_NAME:-soc_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # DATABASE ADMIN: pgAdmin 4
  # -----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: soc_pgadmin
    pull_policy: missing
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@soc.crru.ac.th
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    profiles:
      - tools
    networks:
      - soc-network
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------------------------
  # MODULAR MONOLITH BACKEND: API Gateway & All Modules (Port 3000 -> Host BACKEND_PORT:-4001)
  # -----------------------------------------------------------------
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: soc_api_gateway
    ports:
      - "${BACKEND_PORT:-4001}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-soc_admin}:${DB_PASSWORD:-Soc0903297444}@db:5432/${DB_NAME:-soc_db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-this-in-production}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-4000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:${BACKEND_PORT:-4001}/api/auth/google/callback
      - NODE_OPTIONS=--max-old-space-size=256
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    networks:
      - soc-network
    depends_on:
      db:
        condition: service_healthy
    restart: always


  # -----------------------------------------------------------------
  # FRONTEND: Next.js (Port 3000 -> Host FRONTEND_PORT:-4000)
  # -----------------------------------------------------------------

  # -----------------------------------------------------------------
  # FRONTEND: Next.js (Port 3000 -> Host FRONTEND_PORT:-4000)
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: soc_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./frontend/.next:/app/.next
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      INTERNAL_API_URL: http://api-gateway:3000
    networks:
      - soc-network
    depends_on:
      - api-gateway


networks:
  soc-network:
    driver: bridge
